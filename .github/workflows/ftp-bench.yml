name: ftp-bench

# Measures the deploy's upload phase against the real host from a runner, so
# the upload strategy is chosen on measurements instead of on an assumption.
# Run by hand only (Actions -> ftp-bench -> Run workflow): it talks to the real
# FTP host, so it must never ride along on an ordinary push.
#
# The probe always runs - it is the one that explains where the time goes. The
# strategy shootout is opt-in because its numbers are already known and it is
# by far the slower half (its deliberately-serial variant alone takes ~2 min).
on:
  workflow_dispatch:
    inputs:
      shootout:
        description: 'Also run the strategy shootout (tools/ftp-bench.sh)'
        type: boolean
        default: false
      deploy:
        description: 'Instead: time tools/deploy.sh against staging (cold, then delta)'
        type: boolean
        default: false
      smoke:
        description: 'Instead: time the remote smoke against staging, tunnel vs direct'
        type: boolean
        default: false
      cleanup:
        description: 'Instead: delete the fixed-id harness test data from LIVE'
        type: boolean
        default: false

jobs:
  bench:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      # Full history: the deploy timing checks out earlier versions of
      # tools/deploy.sh out of git so every variant is measured in one run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Probe (where does the time go)
        if: ${{ !inputs.deploy && !inputs.smoke && !inputs.cleanup }}
        env:
          SMOKE_BASE: https://fok-server.poggensee.it/staging
        run: |
          bash tools/ftp-probe.sh
          bash tools/http-probe.sh
      - name: Shootout (which strategy is fastest)
        if: ${{ inputs.shootout && !inputs.deploy && !inputs.smoke && !inputs.cleanup }}
        run: bash tools/ftp-bench.sh

      # Times the real deploy against staging/ only - never the live webroot -
      # so a deploy change can be measured and proven end to end on a branch,
      # before it reaches main and becomes a production deploy.
      # This host's run-to-run spread is ~30%, which is wider than the
      # difference being looked for, so a number from one dispatch cannot be
      # compared against a number from another. Every variant is therefore
      # measured in ONE run, and the current one is measured twice - once
      # before the older variants and once after - so drift across the run
      # shows up as the gap between those two instead of being credited to the
      # change.
      - name: Time the deploy against staging
        if: ${{ inputs.deploy }}
        run: |
          # Into tools/, not /tmp: every version of the script starts with
          # `cd "$(dirname "$0")/.."`, so from anywhere else it deploys the
          # wrong tree - or, as it did, no tree at all.
          git show origin/main:tools/deploy.sh > tools/zz-deploy-main.sh
          git show bff65ab:tools/deploy.sh     > tools/zz-deploy-prev.sh  # before the rewrite
          run() { local t; t=$(date +%s%3N); "$@"; echo "  ^^ $(( $(date +%s%3N) - t )) ms"; }
          pair() {
            echo "--- $1: cold, the whole tree ---"
            run env DEPLOY_FULL=1 bash "$2" staging
            echo "--- $1: delta, nothing changed ---"
            run bash "$2" staging
          }
          pair "NEW  one login, queued swap" tools/deploy.sh
          pair "MAIN what production runs"   tools/zz-deploy-main.sh
          pair "PREV three logins, serial"   tools/zz-deploy-prev.sh
          pair "NEW  again, to show drift"   tools/deploy.sh
          echo "--- NEW: delta, one src file and one asset changed ---"
          printf '\n' >> public/src/Settings.php
          printf '\n' >> public/assets/style.css
          run bash tools/deploy.sh staging
          git checkout -- public
          echo "--- NEW: delta, those two reverted ---"
          run bash tools/deploy.sh staging

      # Same suite, same host, only the transport differs - so the number the
      # tunnel is worth is measured rather than predicted. The tunnel runs
      # first: anything the host caches across the two runs then favours the
      # DIRECT half, which makes the comparison conservative.
      - name: Time the remote smoke against staging
        if: ${{ inputs.smoke }}
        env:
          SMOKE_BASE: https://fok-server.poggensee.it/staging
          FOK_ADMIN_USER: ${{ secrets.FOK_ADMIN_USER }}
          FOK_ADMIN_PASS: ${{ secrets.FOK_ADMIN_PASS }}
        run: |
          run() {
            local t rc; t=$(date +%s%3N)
            "$@" > /tmp/smoke.out 2>&1 && rc=0 || rc=$?
            grep -E 'tunnel|FAIL' /tmp/smoke.out || true
            tail -2 /tmp/smoke.out
            echo "  ^^ $(( $(date +%s%3N) - t )) ms  (exit $rc)"
          }
          echo "--- through the keep-alive tunnel ---"
          run bash test/smoke.sh
          echo "--- direct, one TLS handshake per request ---"
          run env SMOKE_NO_PROXY=1 bash test/smoke.sh

      # The only step in this workflow that touches LIVE, and the only one
      # anywhere that deletes anything: it removes the three fixed harness ids
      # and the item instances they own. Manual dispatch only, like the rest.
      - name: Clear the fixed-id harness data from live
        if: ${{ inputs.cleanup }}
        env:
          FOK_ADMIN_USER: ${{ secrets.FOK_ADMIN_USER }}
          FOK_ADMIN_PASS: ${{ secrets.FOK_ADMIN_PASS }}
        run: bash tools/live-cleanup.sh
