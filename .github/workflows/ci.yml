name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, apcu
          # Tournament state lives in APCu shared memory, so the unit tests and
          # the php -S smoke run both need it enabled off the web SAPI too.
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Checks (syntax, ASCII, secrets, consistency, unit, smoke)
        run: bash test/checks.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## FOK-server CI"
            echo "- PHP syntax lint over all tracked .php files"
            echo "- ASCII-only guard over all text sources"
            echo "- Secret/credential leak guard"
            echo "- strict_types consistency guard"
            echo "- Unit tests (test/unit.php)"
            echo "- HTTP smoke test against php -S (test/smoke.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

      # A red check SKIPS the deploy job below, and api/version.txt keeps
      # answering the old version - so nothing about live LOOKS wrong, and a
      # release can sit undeployed unnoticed. Say it where the run is red.
      - name: Say that live was not deployed
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "> **LIVE WAS NOT DEPLOYED.** The checks failed, so the deploy job is skipped and live still runs the previous version." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - uses: actions/checkout@v5

      # curl cannot reuse an FTP connection and the host rate-limits logins,
      # so the deploy needs lftp's pooled connections (tools/deploy.sh).
      - name: Install lftp
        # The runner image carries Google's Chrome apt source, and a hash
        # mismatch on that mirror fails apt-get update for every package.
        # lftp comes from Ubuntu's own archive, so the third-party source
        # goes before the refresh rather than being trusted to be up.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to staging
        run: bash tools/deploy.sh staging

      - name: Smoke test staging
        env:
          SMOKE_BASE: https://fok-server.poggensee.it/staging
          FOK_ADMIN_USER: ${{ secrets.FOK_ADMIN_USER }}
          FOK_ADMIN_PASS: ${{ secrets.FOK_ADMIN_PASS }}
        run: bash test/smoke.sh

      - name: Deploy to live
        run: bash tools/deploy.sh

      # The deploy uploads file by file, so for a moment after it returns the
      # live tree is a mix of both releases and version.txt can still answer
      # the old number. That is not a failed deploy, so give the swap a few
      # seconds to settle rather than reading once and going red.
      - name: Verify live
        run: |
          want=$(grep -oE "FOK_SERVER_VERSION = '[^']+'" public/src/Config.php | cut -d"'" -f2)
          for i in $(seq 1 15); do
            got=$(curl -s https://fok-server.poggensee.it/api/version.txt)
            echo "attempt $i: expect server $want, got: $got"
            if echo "$got" | grep -q "\"server\":\"$want\""; then
              break
            fi
            sleep 2
          done
          echo "$got" | grep -q "\"server\":\"$want\""
          echo "$got" | grep -q '"env":"live"'
          # version.txt is static and answers every origin with '*', so the
          # allowlist is proved where it actually lives - on an endpoint that
          # runs the code holding the list. time.php is a GET that records
          # nothing, so asking live for it moves no counter.
          cors=$(curl -s -i -H 'Origin: https://poeggi.github.io' \
            https://fok-server.poggensee.it/api/time.php | grep -i '^access-control-allow-origin')
          echo "$cors" | grep -q 'poeggi.github.io'
          echo "Live is up on v$want, reachable from the game origin" >> "$GITHUB_STEP_SUMMARY"
